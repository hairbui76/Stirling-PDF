name: Rust Processing Backend CI

# Required quality gate for the Rust processing backend. The top-level build
# workflow invokes this on relevant PR and merge-queue changes; the direct push
# trigger provides the same post-merge safety net on main.
on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  processing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901d61fb841f559994984270fce7 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Quality-check Rust processing backend
        run: task rust:check
