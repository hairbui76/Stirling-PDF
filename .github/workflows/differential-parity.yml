name: Differential parity (Java vs Rust)

# Runs the Java-vs-Rust differential harness (testing/differential/) against BOTH
# backends live, and fails on any real semantic parity diff. This is the piece
# the sandbox cannot run (it has no JDK 25 / bootJar / native tools) — here we
# build both backends and drive them for real.
#
# Scope note: the harness manifest is intentionally limited to deterministic,
# tool-light endpoints (page ops + get-info) that need only PDFBox / pdfium /
# lopdf / Ghostscript. Expanding it to converters/OCR/repair requires installing
# LibreOffice / Tesseract / qpdf / WeasyPrint / Calibre in the "Install native
# tools" step below.

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Weekly, Monday 03:17 UTC — a low-noise parity heartbeat, not a per-PR gate.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: differential-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_URL: http://127.0.0.1:8091
      JAVA_URL: http://127.0.0.1:8080
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Gradle dependency artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2/files-2.1
            ~/.gradle/caches/modules-2/metadata-2.*
          key: gradle-deps-${{ runner.os }}-jdk-25-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle', 'settings.gradle', 'gradle/libs.versions.toml') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: 9.6.1
          cache-disabled: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust -> target

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install native tools (Ghostscript for the harness render-compare)
        # The harness compares PDFs by rasterising with Ghostscript. The current
        # deterministic manifest needs no other native tool. Add libreoffice /
        # tesseract-ocr / qpdf / weasyprint / calibre here if the manifest grows.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript
          gs --version

      # Java FIRST: the Gradle build generates app/common/src/main/resources/version.properties
      # (task `writeVersion`, build.gradle), which the Rust crate include_str!s at compile time
      # (runtime_metrics.rs). That file is gitignored, so on a fresh runner Rust cannot compile
      # until Gradle has produced it.
      - name: Build Java backend (bootJar, also generates version.properties)
        run: ./gradlew :stirling-pdf:bootJar

      - name: Build Rust backend
        working-directory: rust
        run: cargo build -p stirling-processing --locked

      - name: Start both backends and run the differential diff
        shell: bash
        run: |
          set -euo pipefail

          # --- start the Rust backend (open mode) ---
          STIRLING_PORT=8091 SERVER_PORT=8091 \
            ./rust/target/debug/stirling-processing > rust-backend.log 2>&1 &
          echo $! > rust.pid

          # --- start the Java backend (open mode, security off) ---
          JAR="$(ls app/core/build/libs/*.jar | grep -v -- '-plain' | head -1)"
          echo "Java bootJar: $JAR"
          SERVER_PORT=8080 SECURITY_ENABLELOGIN=false \
            java -jar "$JAR" > java-backend.log 2>&1 &
          echo $! > java.pid

          wait_ready() {
            local name="$1" url="$2" tries="$3" i
            for ((i = 1; i <= tries; i++)); do
              if curl -fsS -o /dev/null "$url/api/v1/info/status"; then
                echo "$name ready after ${i}s"; return 0
              fi
              sleep 1
            done
            echo "::error::$name did not become ready within ${tries}s"; return 1
          }

          wait_ready "Rust" "$RUST_URL" 60
          wait_ready "Java" "$JAVA_URL" 240

          # --- run the diff; a real parity DIFF exits non-zero and fails the job ---
          python3 testing/differential/differential.py --diff \
            --rust-url "$RUST_URL" \
            --java-url "$JAVA_URL" \
            --no-color | tee diff-report.txt

      - name: Upload differential report and backend logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-parity
          path: |
            diff-report.txt
            rust-backend.log
            java-backend.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop backends
        if: always()
        shell: bash
        run: |
          for f in rust.pid java.pid; do
            if [ -f "$f" ]; then kill "$(cat "$f")" 2>/dev/null || true; fi
          done
