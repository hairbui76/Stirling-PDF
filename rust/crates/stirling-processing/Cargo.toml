[package]
name = "stirling-processing"
version = "0.1.0"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ab_glyph = "0.2.32"
aes = { version = "0.9.1", features = ["zeroize"] }
aes-gcm = { version = "0.11.0", features = ["zeroize"] }
ammonia = "4.1.3"
axum = { version = "0.8.9", features = ["multipart"] }
aws-sdk-s3 = "=1.137.0"
base64 = "0.22.1"
bcder = "0.7.7"
bcrypt = "0.18.0"
bytes = "1.12.1"
chrono = "0.4.45"
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
cryptoki = "0.12.0"
cryptographic-message-syntax = { version = "0.28.0", default-features = false, features = ["http"] }
data-encoding = "2.11.0"
des = { version = "0.9.0", features = ["zeroize"] }
ed25519-dalek = "2.2.0"
futures-util = "0.3.32"
governor = "0.10.4"
hmac = "0.13.0"
lopdf = "0.44.0"
mailparse = "0.16.1"
md-5 = "0.11.0"
msg_parser = "0.3.6"
moxcms = "0.8.1"
notify = "8.2.0"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
imageproc = { version = "0.26.0", default-features = false, features = ["text"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
jiff = "0.2.32"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
pdfium-render = { version = "0.9.3", default-features = false, features = ["image_latest", "pdfium_7543", "thread_safe"] }
p12-keystore = "0.3.1"
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "pem", "pkcs8"] }
p384 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "pem", "pkcs8"] }
p521 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "pem", "pkcs8"] }
pem = "3.0.6"
pkcs8 = { version = "0.11.0", features = ["3des", "des-insecure", "encryption", "getrandom", "pem", "sha1-insecure"] }
pulldown-cmark = "0.13.4"
rand = "0.10.2"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
roxmltree = "0.20.0"
rsa = { version = "0.10.0-rc.18", features = ["getrandom"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.14.1"
rustls-webpki = { version = "0.103.13", features = ["alloc", "ring"] }
rxing = { version = "0.9.1", default-features = false, features = ["decoders", "encoding_rs", "qrcode"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
signature-v2 = { package = "signature", version = "2.2.0" }
svg2pdf = "0.13.0"
subtle = "2.6.1"
# Cross-platform PID and process-start-time checks for the desktop parent watcher.
# 0.38 is the newest sysinfo line compatible with the workspace's Rust 1.94 toolchain.
sysinfo = { version = "0.38.4", default-features = false, features = ["network", "system"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tiff = "0.11.3"
tokio-stream = "0.1.18"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.6.8", features = ["limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"
x509-certificate = "0.25.0"
x509-parser = "0.18.1"
zeroize = { version = "1.9.0", features = ["serde"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
zune-core = "0.5.1"
zune-jpeg = "0.5.15"

[target.'cfg(windows)'.dependencies]
schannel = "0.1.29"

[dev-dependencies]
crypto-bigint = "0.7.5"
jks = { version = "0.3.3", default-features = false, features = ["rand"] }
