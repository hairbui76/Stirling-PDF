[package]
name = "stirling-processing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bcder = "0.7.7"
chrono = "0.4.45"
cryptographic-message-syntax = { version = "0.28.0", default-features = false }
futures-util = "0.3.32"
lopdf = "0.44.0"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
pdfium-render = { version = "0.9.3", default-features = false, features = ["image_latest", "pdfium_7543", "thread_safe"] }
rand = "0.10.2"
regex = "1.12.2"
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.14.1"
rustls-webpki = { version = "0.103.13", features = ["alloc", "ring"] }
rxing = { version = "0.9.1", default-features = false, features = ["decoders", "encoding_rs", "qrcode"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
svg2pdf = "0.13.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tiff = "0.11.3"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"
x509-certificate = "0.25.0"
x509-parser = "0.18.1"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
