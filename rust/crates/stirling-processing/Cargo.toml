[package]
name = "stirling-processing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = "0.4.45"
futures-util = "0.3.32"
lopdf = "0.44.0"
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png"] }
pdfium-render = { version = "0.9.3", default-features = false, features = ["image_latest", "pdfium_7543", "thread_safe"] }
rand = "0.10.2"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"
zip = { version = "8.2.0", default-features = false }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
