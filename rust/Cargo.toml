[workspace]
members = [
    "crates/stirling-ai-engine",
    "crates/stirling-operation-catalog",
    "crates/stirling-processing",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
